[project]
name = "ketocare-bot"
version = "0.1.0"
description = "Telegram-бот KetoCare (aiogram 3). Реализация FSM-сценариев — этап 3 ТЗ."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "httpx>=0.27",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    # Состояния FSM и секреты привязок обязаны переживать перезапуск:
    # память процесса теряет и то и другое, и после каждого деплоя семьи
    # оказывались бы отвязаны посреди начатого ввода (ADR-0009).
    # Пакет уже приходит транзитивно с arq в воркере, но опираться на
    # чужую зависимость нельзя: она исчезнет при первой смене очереди.
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
