[project]
name = "ketocare-worker"
version = "0.1.0"
description = "ARQ-воркер KetoCare (AI-задачи, PDF, напоминания). Задачи наполняются на этапах 2-4 ТЗ."
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    "ketocare-core",
]

[tool.uv.sources]
ketocare-core = { workspace = true }

[dependency-groups]
test = [
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
