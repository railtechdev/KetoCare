[project]
name = "ketocare-worker"
version = "0.1.0"
description = "ARQ-воркер KetoCare (AI-задачи, PDF, напоминания). Задачи наполняются на этапах 2-4 ТЗ."
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    # weasyprint тянет системные библиотеки (pango, cairo). Импортируется лениво,
    # внутри функции печати: без этого сборка отчёта роняла бы весь воркер на
    # машине, где библиотек нет, включая задачи, которым PDF не нужен.
    "weasyprint>=70",
    "ketocare-core",
    # Единый вызов для любых поставщиков моделей (ADR-0082). Импортируется лениво и
    # только в `ai/transport.py`: задачам отчётов и напоминаний он не нужен.
    # Версия закреплена нижней границей после компрометации 1.82.7/1.82.8 на PyPI
    # (март 2026); точную версию и хэши держит uv.lock.
    "litellm>=1.83",
]

[tool.uv.sources]
ketocare-core = { workspace = true }

[dependency-groups]
test = [
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
