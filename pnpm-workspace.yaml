packages:
  - "apps/e2e"
  - "apps/web"
  - "apps/miniapp"
  - "packages/landing"
  - "packages/ui"
  - "packages/api-client"

# Переопределения версий (`pnpm.overrides`) лежат в `package.json`: их читает
# pnpm 9, который закреплён в `packageManager`. В pnpm 10 это поле переехало
# сюда, и при обновлении менеджера его нужно перенести — иначе override
# перестанет применяться МОЛЧА, без ошибки, и вернётся уязвимость, ради которой
# он заведён (сейчас это `valibot >=1.4.2`, ReDoS в регулярке эмодзи,
# docs/SECURITY_REVIEW.md). Признак, что пора переносить: предупреждение
# «The "pnpm" field in package.json is no longer read by pnpm».
#
# ПРЕДУПРЕЖДЕНИЕ УЖЕ ПОЯВИЛОСЬ (10.09.2026), и переносить его пока НЕЛЬЗЯ.
# Разошлись две установки: `packageManager` держит pnpm 9.15.0, а на машине
# разработчика из homebrew работает pnpm 11 — он это поле игнорирует. Перенести
# сюда значит выключить override у всех, кто ставит закреплённой девяткой,
# включая CI.
#
# Сегодня это не дыра: в `pnpm-lock.yaml` уже записан valibot 1.4.2, а установка
# идёт по лок-файлу. Опасность отложенная — следующее разрешение зависимостей на
# машине с pnpm 11 ограничения не увидит.
#
# Правильный порядок: сначала поднять `packageManager` до pnpm 11 и обновить
# установку менеджера в CI, и ТОЙ ЖЕ правкой перенести `overrides` сюда. Одно
# без другого молча отключает защиту.
