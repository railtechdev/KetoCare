# Золотой корпус постфильтра сводки (раздел 10.5 ТЗ).
#
# Слева — что фильтр обязан пометить жёсткой находкой, справа — что обязан
# пропустить без единой находки. Правая половина здесь важнее, чем у помощника:
# сводка обязана пересказывать дозы и даты изменений назначения, и фильтр,
# ошибающийся в эту сторону, забракует каждый честный черновик.
#
# Формулировки взяты не из фантазии: часть — прогон постфильтра помощника на
# реалистичных сводках (он блокировал первые четыре из `must_pass` и пропускал
# все `must_block` класса recommendation). Каждую новую формулировку сначала
# добавляют сюда, потом чинят правило — обратный порядок даёт правило,
# подогнанное под один случай.

must_block:
  - kind: recommendation
    text: Целесообразно обсудить коррекцию дозы вальпроата.
    why: долженствование — рекомендация врачу, а не пересказ рядов
  - kind: recommendation
    text: Показан пересмотр назначения.
    why: то же, безлично
  - kind: recommendation
    text: Рекомендуется рассмотреть перевод на соотношение 4:1.
    why: рекомендация с конкретным изменением терапии
  - kind: recommendation
    text: Динамика говорит о необходимости коррекции питания.
    why: долженствование через существительное
  - kind: recommendation
    text: Возможно, стоит рассмотреть более частый контроль кетонов.
    why: смягчённая форма — та же рекомендация
  - kind: recommendation
    text: Требуется коррекция кетосоотношения.
    why: парный признак — долженствование плюс действие
  - kind: evaluation
    text: Эффективность текущей терапии недостаточная.
    why: оценка результата лечения, а не наблюдаемая величина
  - kind: evaluation
    text: Прогноз на следующий период благоприятный.
    why: прогноз — не констатация
  - kind: evaluation
    text: Данные соответствуют недостаточному метаболическому ответу.
    why: суждение об ответе на терапию
  - kind: evaluation
    text: Контроль приступов достаточный.
    why: парный признак — оценка, отнесённая к течению болезни
  - kind: causal_reading
    text: Снижение кетонов произошло из-за смены назначения 12.08.
    why: утверждение о причине; из рядов она не следует
  - kind: causal_reading
    text: Учащение приступов обусловлено пропусками приёма препарата.
    why: то же, другой связкой
  - kind: diagnosis
    text: Картина у ребёнка соответствует синдрому Драве.
    why: постановка диагноза
  - kind: diagnosis
    text: Признаки указывают на дефицит карнитина у пациента.
    why: состояние, отнесённое к ребёнку

must_pass:
  - text: Доза депакина увеличена 12.08 с 200 мг до 300 мг в сутки.
    why: лекарственные отметки — прямое требование раздела 10.5 ТЗ
  - text: Калорийность назначения увеличена с 1100 до 1200 ккал 15.08.
    why: версии назначений с датами — тоже вход сводки
  - text: Ламотриджин 25 мг — отмечено 26 приёмов из 30.
    why: приверженность пересказывается числами, а доза — подпись препарата
  - text: За период записано 14 приступов в 9 днях, чаще всего тонические.
    why: счёт по типам и дням
  - text: "Кетоны крови: 28 замеров, от 1.9 до 3.2 ммоль/л, в среднем 2.4."
    why: ряд с разбросом и средним
  - text: Вес 14.2 кг на 01.08 и 14.0 кг на 29.08, снижение на 0.2 кг.
    why: динамика веса — наблюдаемая величина, а не оценка
  - text: После смены назначения 12.08 приступов записано меньше — 4 против 8 неделей раньше.
    why: два факта рядом; «после» — не «из-за»
  - text: Записей нет с 20 по 22.08, поэтому неделя описана по четырём дням.
    why: замечание о качестве данных — отдельный раздел сводки
  - text: Замеров кетонов за третью неделю недостаточно для сравнения с первой.
    why: «недостаточно» о данных, а не о терапии
  - text: Меню спланировано в 24 днях из 31, отмечено съеденными 96 позиций из 120.
    why: выполнение меню
  - text: Данных за период нет.
    why: строка пустого раздела, которую требует промпт
