[project]
name = "ketocare-core"
version = "0.1.0"
description = "Модели SQLAlchemy, схемы, репозитории и конфиг KetoCare"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1.0",
    "structlog>=24.4",
    # Отправка ошибок: включается только заданным SENTRY_DSN (core.observability).
    "sentry-sdk>=2.19",
    # Коэффициенты Атуотера (9/4/4) для отбора продуктов по ведущему
    # макронутриенту. Направление `core -> keto_engine` заводится здесь впервые
    # и разрешено: ТЗ запрещает обратное — ядро не имеет права знать о БД и I/O.
    # Вторая копия медицинских констант в `core` была бы нарушением правила 1.
    "keto-engine",
]

[tool.uv.sources]
keto-engine = { workspace = true }

[dependency-groups]
test = [
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
