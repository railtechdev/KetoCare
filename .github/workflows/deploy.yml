name: Deploy
run-name: Deploy → ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}

# Выкат на два окружения (ADR-0095, docs/DEPLOY.md):
#
#   • `demo` — тестовый сервер: сюда `main` едет сам после зелёного CI;
#   • `production` — боевой, с настоящими пациентами: только кнопкой
#     (Actions → Deploy → Run workflow) и только коммитом из `main`, который
#     прямо сейчас стоит на тестовом.
#
# Секретов приложения здесь нет вовсе, настроек — тоже. Пароль базы и ключи
# подписи создаёт сам сервер, его адреса и часовой пояс записаны на нём при
# настройке, токен бота и ключи ИИ вводятся в кабинете. Отсюда на сервер едет
# одно имя окружения — сервер сверяет его со своей меткой.
#
# Секретно здесь только то, чем выкат заходит на сервер: `DEMO_DEPLOY_*` и
# `PROD_DEPLOY_*` — секреты уровня репозитория. Окружения GitHub (Settings →
# Environments) не используются намеренно: их заводит только владелец
# репозитория, а мы работаем в нём как соавторы. Имена с приставкой
# окружения выбираются явно, поэтому секрет одного сервера не может молча
# подставиться вместо секрета другого.
#
# Запускается ПОСЛЕ зелёного CI, а не по самому push: событие push приходит
# раньше, чем известен результат тестов, и деплой по нему выкатывал бы
# непроверенный код.
#
# Репозиторий ПУБЛИЧНЫЙ, и это определяет половину решений здесь:
#   • журнал прогона читает кто угодно — логи контейнеров сюда не выводятся:
#     в access-логе uvicorn пути вида /api/v1/patients/<uuid>/logs, то есть
#     следы клинических данных;
#   • `workflow_run` приходит и от прогонов из форков, а `head_branch` там —
#     имя ветки в форке, и она вполне может называться `main`. Поэтому условие
#     проверяет ещё и репозиторий-источник, и событие;
#   • `pull_request_target` не используется нигде и не должен: он идёт с
#     секретами в контексте базового репозитория.
#
# Ключ доступа ограничен на стороне сервера: в authorized_keys он записан с
# `restrict,command="…/remote-deploy.sh"`, и ничего другого выполнить не может.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Только прогоны CI с ветки main.
    #
    # Без этого фильтра прогон CI КАЖДОГО pull request создавал запуск
    # «Выкатка», который тут же пропускался условием job'а: в списке действий
    # копились серые строки «skipped» вперемешку с настоящими выкатами, и
    # верхняя из них выглядела как «деплой не прошёл». Условие job'а ниже
    # остаётся — фильтр убирает шум, а проверку делает оно.
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Куда выкатывать"
        type: choice
        options: [demo, production]
        default: demo
      allow_untested:
        description: "Боевой: выкатить коммит, которого сейчас нет на тестовом (только авария)"
        type: boolean
        default: false
      ref:
        description: "Коммит или ветка для выкатки (по умолчанию — вершина main); на сервер уходит её SHA"
        required: false
        default: "main"

# Два деплоя одновременно ломают сервер: миграции и `compose up` из разных
# прогонов встретятся на одной базе. cancel-in-progress намеренно false —
# оборванный посреди `rsync --delete` деплой оставит пустой /var/www, то есть
# белый экран вместо кабинета. Замок — на окружение: тестовый и боевой друг
# друга не ждут.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкатка
    runs-on: ubuntu-latest
    # Четыре условия, а не одно: успех прогона, событие push (а не
    # pull_request), ветка main И тот же репозиторий — иначе форк с веткой
    # «main» дотянулся бы до боевого стенда.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      # Автоматический выкат — всегда на тестовый; боевой называют руками.
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}
    permissions:
      contents: read
    timeout-minutes: 40

    steps:
      - name: Определить и проверить коммит
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # Через окружение, а не подстановкой `${{ }}` в тело: строка из формы
          # «Run workflow» иначе становилась бы частью скрипта.
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TIP=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # На сервер уходит ТОЛЬКО полный SHA, никогда имя ветки. Ручной
            # запуск с `ref: main` (умолчание формы и путь восстановления из
            # docs/DEPLOY.md) 08.10.2026 падал: исполняемая копия
            # remote-deploy.sh на сервере брала ЛОКАЛЬНУЮ ветку `main`,
            # застывшую на fe63b65, вместе со старым deploy.sh, а тот падал на
            # `git pull` в отсоединённом HEAD. SHA одинаково понимает любая
            # версия серверного скрипта. Ветка и сокращённый хеш разрешаются
            # здесь, через API, по origin — тем же запросом, что TIP.
            WANTED="${INPUT_REF:-main}"
            # Строка уходит в путь запроса к API: `..` увёл бы его к другой ручке.
            if ! printf '%s' "$WANTED" | grep -qE '^[A-Za-z0-9._/-]{1,120}$' \
               || printf '%s' "$WANTED" | grep -q '\.\.'; then
              echo "::error::Недопустимая ссылка на коммит"
              exit 1
            fi
            if [ "$WANTED" = "main" ]; then
              REF="$TIP"
            else
              REF=$(gh api "repos/$REPOSITORY/commits/$WANTED" --jq .sha) || {
                echo "::error::Ссылка «${WANTED}» не найдена в репозитории"
                exit 1
              }
            fi
          else
            # head_sha прогона, а не вершина main: пока шёл CI, в main мог
            # уехать ещё один коммит, и выкатился бы непроверенный.
            REF="$RUN_SHA"

            # Прогон относится не к вершине main — выкатывать его нельзя: стенд
            # молча откатился бы на предыдущую версию, и при аддитивных
            # миграциях этого какое-то время никто бы не заметил. Так бывает в
            # двух случаях, и оба нормальны: повторный запуск старого зелёного
            # прогона (обычное дело при флаки-тесте) и два слияния подряд, когда
            # CI первого финиширует уже после второго.
            #
            # Это ОТКАЗ ОТ ДЕЙСТВИЯ, а не сбой: выкатится следующий прогон, тот
            # самый, что относится к вершине. Красный крест здесь означал бы
            # поломку там, где всё сработало правильно, — а на серии слияний он
            # загорался бы каждый раз, и настоящий сбой деплоя перестал бы
            # отличаться от штатной работы.
            if [ "$REF" != "$TIP" ]; then
              echo "::notice::Прогон относится к $REF, а вершина main — $TIP. Выкатку делает прогон вершины."
              echo "stale=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! printf '%s' "$REF" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Не удалось получить полный SHA коммита (получено: «${REF}»)"
            exit 1
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Выкатывается: $REF"

      - name: Боевой — только проверенный коммит из main
        id: gate
        if: steps.target.outputs.stale != 'true' && env.DEPLOY_ENVIRONMENT == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.target.outputs.ref }}
          REPOSITORY: ${{ github.repository }}
          # Адрес кабинета тестового сервера: выкат кладёт туда `version.txt`
          # с коммитом. Переменная репозитория, а не окружения — её читает
          # прогон боевого.
          DEMO_APP_URL: ${{ vars.DEMO_APP_URL }}
          ALLOW_UNTESTED: ${{ inputs.allow_untested }}
        run: |
          # 1. Коммит обязан лежать в main: ветка, не прошедшая PR, на сервер
          #    с пациентами не едет ни при каких флажках.
          STATUS=$(gh api "repos/$REPOSITORY/compare/$REF...main" --jq .status) || {
            echo "::error::Не удалось сверить коммит с main"
            exit 1
          }
          case "$STATUS" in
            ahead|identical) echo "коммит $REF лежит в main" ;;
            *) echo "::error::Коммит $REF не входит в main (compare: $STATUS) — на боевой не выкатывается"; exit 1 ;;
          esac

          # 2. Тот же коммит прямо сейчас стоит на тестовом: его там видели.
          if [ "$ALLOW_UNTESTED" = "true" ]; then
            echo "::warning::Проверка «коммит стоит на тестовом» отключена флажком allow_untested"
            exit 0
          fi
          if [ -z "$DEMO_APP_URL" ]; then
            echo "::error::Не задана переменная репозитория DEMO_APP_URL — нечем сверить коммит с тестовым"
            exit 1
          fi
          ON_DEMO=""
          for attempt in 1 2 3; do
            ON_DEMO=$(curl -fsS --max-time 20 "${DEMO_APP_URL%/}/version.txt" | tr -d '[:space:]' || true)
            [ -n "$ON_DEMO" ] && break
            [ "$attempt" = "3" ] || sleep 10
          done
          if [ "$ON_DEMO" != "$REF" ]; then
            echo "::error::На тестовом стоит «${ON_DEMO:-нет ответа}», а на боевой просят $REF. Сначала выкат на тестовый и проверка там."
            exit 1
          fi
          echo "на тестовом стоит тот же коммит"

      - name: Собрать окружение для сервера
        if: steps.target.outputs.stale != 'true'
        run: |
          umask 077
          # Одна строка — имя окружения. Адреса, часовой пояс и пределы сервер
          # хранит сам (/etc/ketocare/settings.env, bootstrap-server.sh), ключи
          # создаёт сам (server-secrets.sh), интеграции вводятся в кабинете.
          printf 'DEPLOY_ENVIRONMENT=%s\n' "$DEPLOY_ENVIRONMENT" > env.rendered

      - name: Выкатить
        if: steps.target.outputs.stale != 'true'
        env:
          # Боевой называют только руками; всё остальное — тестовый.
          DEPLOY_SSH_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && secrets.PROD_DEPLOY_SSH_KEY || secrets.DEMO_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && secrets.PROD_DEPLOY_KNOWN_HOSTS || secrets.DEMO_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && secrets.PROD_DEPLOY_HOST || secrets.DEMO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && secrets.PROD_DEPLOY_USER || secrets.DEMO_DEPLOY_USER }}
          DEPLOY_REF: ${{ steps.target.outputs.ref }}
        run: |
          umask 077
          # Пустой секрет — окружение не заведено (github_environment.py).
          # Выкат останавливается до соединения: иначе ssh ушёл бы по пустому
          # адресу с ошибкой, по которой причину не понять.
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Для окружения «$DEPLOY_ENVIRONMENT» не заведён доступ к серверу (${name}) — см. docs/DEPLOY.md"
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          # known_hosts, а не StrictHostKeyChecking=no: иначе первый же перехват
          # соединения останется незамеченным, а через этот ключ ходят на машину
          # с клиническими данными. Сценарий не выдуманный: VPS пересоздают, и
          # адрес достаётся другому клиенту хостера.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Один вызов на весь деплой. Ключ на сервере ограничен
          # `command="…/remote-deploy.sh"`, поэтому строка команды — это не
          # команда, а аргумент: скрипт читает её из SSH_ORIGINAL_COMMAND.
          # Окружение уходит потоком: аргументы видны в `ps aux` любому
          # локальному пользователю сервера, а там пароль базы и SECRET_KEY.
          # Keepalive обязателен: сборка образов на 2 vCPU идёт двадцать минут,
          # и молчащее соединение рвётся раньше, чем она закончится. Проверено —
          # рвалось. На сервере при этом стоит `trap '' HUP` и flock, поэтому
          # обрыв не оставляет полудеплой и не пускает второй запуск.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_REF" < env.rendered
          rm -f env.rendered ~/.ssh/deploy_key

      - name: Стенд отвечает снаружи
        if: steps.target.outputs.stale != 'true'
        env:
          # Адреса окружения — те же переменные, из которых собирается
          # посадочная. Зашитых адресов нет: проверка боевого по адресам
          # тестового отвечала бы «всё в порядке» про чужую машину.
          LANDING_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && vars.PROD_LANDING_URL || vars.DEMO_LANDING_URL }}
          APP_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && vars.PROD_APP_URL || vars.DEMO_APP_URL }}
        # Три попытки, а не одна. Раннер GitHub ходит до Узбекистана через пол-
        # мира, и 17.09.2026 два выката из пяти были помечены красным на этом
        # шаге при живом стенде: `curl: (28) Connection timed out`, то есть
        # SYN не дошёл. Проверено тогда же — сервер отвечал за 10 мс двенадцать
        # раз подряд, нагрузка 0.11, ufw пропускает 443, а повтор ТОГО ЖЕ
        # коммита проходил. Чинить нечего: это транзит.
        #
        # Цена одной попытки — не ложный красный сам по себе, а то, что он
        # приучает не верить красному: следующий настоящий отказ выката никто
        # не станет смотреть. Повторы сигнал не размывают — если стенд лежит,
        # не ответят все три, и шаг отказывает.
        #
        # Номер удавшейся попытки печатается: деградация пути видна заранее,
        # а не в тот день, когда перестанут проходить все три.
        run: |
          for name in LANDING_URL APP_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задана переменная репозитория для $name окружения «$DEPLOY_ENVIRONMENT» (DEMO_/PROD_LANDING_URL, DEMO_/PROD_APP_URL)"
              exit 1
            fi
          done
          for url in "${LANDING_URL%/}/" "${APP_URL%/}/"; do
            code=""
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo "нет ответа")
              if [ "$code" = "200" ]; then
                echo "$url → 200 (попытка $attempt)"
                break
              fi
              echo "$url → $code (попытка $attempt)"
              [ "$attempt" = "3" ] || sleep 10
            done
            [ "$code" = "200" ] || { echo "::error::$url отдаёт $code после трёх попыток"; exit 1; }
          done

      - name: Что делать при провале
        if: failure() && steps.target.outputs.stale != 'true'
        run: |
          echo "::notice::Если упал шаг сборки фронта — на сервере продолжает работать предыдущая версия."
          echo "::notice::Если упала проверка живости — состояние сервисов напечатано выше, логи смотреть на сервере:"
          echo "::notice::  docker compose --env-file .env -f infra/docker-compose.prod.yml logs --tail=100 api"
          echo "::notice::Повторить деплой без нового коммита: вкладка Actions → Deploy → Run workflow."
