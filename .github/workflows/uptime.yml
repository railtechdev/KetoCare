name: Uptime

# Монитор доступности стенда (docs/DEPLOY.md, «Монитор доступности»).
#
# До него живость стенда проверял только шаг «Стенд отвечает снаружи» в
# deploy.yml, то есть стенд мог пролежать несколько дней, и заметил бы это
# следующий выкат. Здесь те же проверки и больше — страницы, вход до базы,
# сроки сертификатов, бот, ИИ — раз в пятнадцать минут. Логика живёт в
# infra/scripts/uptime_check.py и проверяется тестом против местной подделки
# (infra/tests/test_uptime_check.py); здесь только запуск и issue.
#
# Отказ открывает issue с меткой `uptime` (или `uptime-<окружение>`), новый
# состав отказов дописывается комментарием, восстановление закрывает issue.
# Пока состав прежний, монитор молчит: комментарий каждые пятнадцать минут
# утопил бы сам отказ.
#
# Для прода — тот же файл через `workflow_call` с адресами входами (см. DEPLOY.md):
# адреса test-стенда подставляются только окружению `test`.

on:
  schedule:
    # GitHub запускает расписание с задержкой в минуты и при нагрузке может
    # пропустить запуск — монитор это переживает, отказ всё равно заметит
    # следующий прогон.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Имя окружения (test, prod)"
        required: false
        default: "test"
      landing_url:
        description: "Посадочная (по умолчанию — переменная LANDING_SITE_URL)"
        required: false
      app_url:
        description: "Кабинет (по умолчанию — PUBLIC_APP_URL)"
        required: false
      miniapp_url:
        description: "Mini App (по умолчанию — MINIAPP_ORIGIN)"
        required: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      landing_url:
        type: string
        required: true
      app_url:
        type: string
        required: true
      miniapp_url:
        type: string
        required: true
    secrets:
      BOT_TOKEN:
        required: false
      MONITOR_TOKEN:
        required: false

concurrency:
  group: uptime-${{ inputs.environment || 'test' }}
  cancel-in-progress: false

jobs:
  check:
    name: Стенд отвечает
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      ENVIRONMENT: ${{ inputs.environment || 'test' }}
      LABEL: ${{ (inputs.environment || 'test') == 'test' && 'uptime' || format('uptime-{0}', inputs.environment) }}
      # Адреса test-стенда — те же, что у выката: переменные репозитория, а
      # при их отсутствии — значения шага «Стенд отвечает снаружи».
      # Другому окружению они не подставляются: проверка прода по адресам
      # test-стенда отвечала бы «всё в порядке» про чужую машину.
      LANDING_URL: ${{ inputs.landing_url || ((inputs.environment || 'test') == 'test' && (vars.LANDING_SITE_URL || 'https://ketocare.railtech.uz/') || '') }}
      APP_URL: ${{ inputs.app_url || ((inputs.environment || 'test') == 'test' && (vars.PUBLIC_APP_URL || 'https://app.ketocare.railtech.uz/') || '') }}
      MINIAPP_URL: ${{ inputs.miniapp_url || ((inputs.environment || 'test') == 'test' && (vars.MINIAPP_ORIGIN || 'https://tma.ketocare.railtech.uz/') || '') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Нужен один файл: полный checkout и установка зависимостей стоили бы
      # больше самой проверки.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/scripts
          persist-credentials: false

      - name: Проверить
        id: check
        env:
          # Токен бота нужен только для getMe/getWebhookInfo. Скрипт его не
          # печатает, а GitHub маскирует секреты в журнале и сам.
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Токен ручки /api/v1/health/ai (состояние ИИ по журналу ai_jobs) —
          # то же значение, что deploy.yml кладёт на стенд. Нет секрета —
          # проверка ИИ пропускается, остальные идут.
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          for name in LANDING_URL APP_URL MINIAPP_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Для окружения $ENVIRONMENT не задан $name"
              echo "status=2" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          set +e
          python3 infra/scripts/uptime_check.py \
            --environment "$ENVIRONMENT" \
            --landing "$LANDING_URL" --app "$APP_URL" --miniapp "$MINIAPP_URL" \
            --report report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          [ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Issue об отказе и восстановлении
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
                   --json number --jq '.[0].number // empty' 2>/dev/null || true)
          now=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [ "$STATUS" = "0" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" \
                --body "Восстановлено: все проверки прошли в $now. Прогон: $RUN_URL"
              gh issue close "$open" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi

          # Скрипт упал, не написав отчёта, — это тоже отказ монитора, и о нём
          # тоже нужно знать: молчащий монитор неотличим от живого стенда.
          if [ ! -s report.md ]; then
            printf '<!-- uptime-failed: монитор -->\n**%s**, %s: монитор не сформировал отчёт (код %s).\n\nПрогон: %s\n' \
              "$ENVIRONMENT" "$now" "$STATUS" "$RUN_URL" > report.md
          fi
          marker=$(head -1 report.md)

          if [ -z "$open" ]; then
            gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 \
              --description "Монитор доступности: стенд $ENVIRONMENT" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
              --title "Стенд $ENVIRONMENT не отвечает ($now)" --body-file report.md
            exit 0
          fi

          last=$(gh issue view "$open" --repo "$GITHUB_REPOSITORY" --json body,comments \
                   --jq '[(.body // ""), (.comments[].body // "")] | map(select(startswith("<!-- uptime-failed:"))) | last // "" | split("\n") | .[0] // ""')
          if [ "$last" = "$marker" ]; then
            echo "Отказ продолжается, состав прежний — issue #$open не дополняется."
          else
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file report.md
          fi

      - name: Итог
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::Стенд $ENVIRONMENT: проверки не прошли — подробности в сводке прогона и в issue с меткой $LABEL"
          exit 1
