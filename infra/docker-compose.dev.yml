name: ketocare-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ketocare
      POSTGRES_PASSWORD: ketocare
      POSTGRES_DB: ketocare
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ketocare_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ketocare"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ketocare_postgres_dev:
