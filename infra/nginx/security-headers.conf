# Заголовки безопасности (раздел 11 ТЗ). Подключается в КАЖДЫЙ `location`, а не
# один раз на уровне server — и это не перестраховка.
#
# **Правило наследования `add_header` в nginx:** заголовки с верхнего уровня
# наследуются, только если на текущем уровне нет НИ ОДНОЙ директивы `add_header`.
# Стоит появиться в `location` хоть одному `add_header Cache-Control`, и весь
# набор с уровня `server` для этого location пропадает — молча, без ошибки
# конфигурации.
#
# Именно так и было: у Mini App политика стояла на уровне `server`, а
# `location /` и `location /assets/` задавали Cache-Control — то есть
# единственный ответ, ради которого политика писалась (index.html, цель
# clickjacking), уходил без неё. Работала она ровно там, где не нужна: на
# `location /api/`, единственном блоке без своего `add_header`.
#
# Проверка после выката — одной командой:
#   curl -sI https://app.<домен>/ | grep -iE 'frame|content-security|strict-transport'
#
# `always` обязателен: без него заголовок не попадает в ответы 4xx/5xx, а
# страница ошибки встраивается в рамку так же, как обычная.

# Вставка в рамку запрещена целиком. Кабинет открывается в своей вкладке, и
# встраивать его некуда: единственный, кому рамка нужна, — Mini App, у него
# отдельный host и своя политика.
add_header X-Frame-Options "DENY" always;

# Тип содержимого не угадывается. Без этого загруженный семьёй файл, отданный
# как `text/plain`, браузер может исполнить как HTML.
add_header X-Content-Type-Options "nosniff" always;

# Адрес страницы не уходит на чужие сайты: в нём бывает идентификатор ребёнка
# (`?patient=<uuid>`), и он не должен утекать в Referer внешней ссылки.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Доступ к камере, микрофону и геопозиции приложению не нужен ни в одном
# сценарии — запрещаем на уровне документа.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# HSTS. Год и поддомены: `tma.` и `app.` живут по https, http-версия только
# редиректит. `preload` не включён намеренно — попадание в список браузеров
# необратимо, а домен пилота ещё может смениться.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
