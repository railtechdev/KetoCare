# Политика содержимого Mini App (раздел 11 ТЗ).
#
# Отличается от кабинета одним: рамка разрешена, но только клиентам Telegram.
# Полного запрета здесь быть не может — в веб-версии Telegram приложение
# открывается в iframe; открытого разрешения тоже: тогда любой сайт встроил бы
# карту ребёнка и снимал нажатия поверх неё (clickjacking).
#
# `X-Frame-Options` здесь НЕТ намеренно: он умеет только `DENY` и
# `SAMEORIGIN` — выразить «эти два домена» им нельзя, а `DENY` закрыл бы
# приложение целиком. Браузеры, знающие только его, Mini App и так не
# открывают.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
