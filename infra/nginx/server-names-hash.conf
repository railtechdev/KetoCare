# Кладётся в /etc/nginx/conf.d/ (не в sites-available: это настройка http-блока,
# а не отдельного сайта).
#
# Без неё nginx на чистой Ubuntu 24.04 не стартует ВООБЩЕ — ни один сайт:
#
#   nginx: [emerg] could not build server_names_hash, you should increase
#          server_names_hash_bucket_size: 32
#
# Имя `app.ketocare.railtech.uz` длиннее корзины хеш-таблицы имён по умолчанию.
# Ошибка появляется ровно в тот момент, когда включаются оба сайта сразу, то есть
# на первой же настройке сервера, и выглядит как поломка конфигов, а не как
# нехватка размера корзины.
#
# 64 — следующая степень двойки; хватает с запасом на поддомены домена клиента.
server_names_hash_bucket_size 64;
