# Политика содержимого кабинета (раздел 11 ТЗ).
#
# `frame-ancestors 'none'` дублирует X-Frame-Options не по невнимательности:
# старые браузеры знают только заголовок, новые — только политику, и оба нужны,
# пока в парке есть и те и другие.
#
# `'unsafe-inline'` для стилей — вынужденно: Tailwind и компоненты кита ставят
# инлайновые стили (`style="..."`) на анимациях и графиках. Для скриптов
# послабления нет: собранный бандл идёт файлами, инлайновых `<script>` в
# `index.html` не бывает.
#
# `connect-src 'self'` достаточно: кабинет ходит только в свой `/api`, внешних
# запросов у него нет вовсе. Sentry в браузере не подключён.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
