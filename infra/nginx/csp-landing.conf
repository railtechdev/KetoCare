# Политика содержимого посадочной страницы (раздел 11 ТЗ).
#
# Отдельно от кабинета, потому что различия существенны:
#
# - **`connect-src` разрешает только свой домен.** Форма заявки бьёт в
#   `/api/v1/leads` на этом же домене — так и задумано (ADR-0012): запрос
#   остаётся same-origin, и API не пришлось открывать ещё одному домену в CORS.
# - **`'unsafe-inline'` для стилей.** Astro раскладывает часть правил
#   атрибутами `style="..."` прямо в разметке; хешировать их нельзя — хеши
#   покрывают элементы `<style>`, а не атрибуты.
# - **Скриптов инлайном нет ни одного.** Блок, ставивший классы до первой
#   отрисовки, вынесен в `public/boot.js` именно ради этой строки; блоки
#   `application/ld+json` и `application/json` политикой не затрагиваются —
#   браузер их не исполняет.
#
# Проверка после выката:
#   curl -sI https://<домен>/ | grep -i content-security
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
