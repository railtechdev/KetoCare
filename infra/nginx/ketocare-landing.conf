# Посадочная страница — статика из /var/www/ketocare-landing (Astro,
# `packages/landing`, ADR-0012). Языковые версии лежат подкаталогами: `/`
# русская, `/uz/` и `/en/` — остальные.
#
# Файл кладётся в /etc/nginx/sites-available/ и включается симлинком в
# sites-enabled. HTTPS (443 + редирект с 80) добавляет certbot --nginx.
# При передаче проекта клиенту меняется только server_name.

server {
    listen 80;
    listen [::]:80;
    server_name ketocare.railtech.uz;

    root /var/www/ketocare-landing;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Форма заявки. Проксируется на домене лендинга, а не отправляется на
    # app.*, чтобы запрос оставался same-origin: иначе в CORS пришлось бы
    # открывать API ещё одному домену ради одной публичной ручки.
    # Проброшен ровно один путь — остальной API на этом домене не нужен.
    #
    # Заголовки адреса клиента — как в ketocare-app.conf: X-Forwarded-For
    # ПЕРЕЗАПИСЫВАЕТСЯ, иначе ключ ограничения частоты выбирает сам клиент
    # (infra/nginx/README.md).
    location = /api/v1/leads {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Имена файлов в _astro/ содержат хэш содержимого — кэшировать навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Картинки для карточек в соцсетях и иконки меняются редко.
    location ~* \.(png|svg|jpg|webp|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Сборка идёт в режиме `directory`: /doctors/ — это /doctors/index.html.
    # `$uri/` обязателен, иначе адрес без косой черты в конце даёт 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
