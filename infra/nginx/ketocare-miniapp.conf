# Telegram Mini App (SPA из /var/www/ketocare-miniapp) + прокси /api.
#
# Отдельный host, а не путь внутри кабинета, — так требует раздел 13 ТЗ, и
# причина в заголовках: кабинет запрещает вставку в рамку (`X-Frame-Options`),
# а Mini App живёт ровно в ней — в веб-версии Telegram приложение открывается
# в iframe. Один host на двоих означал бы одну политику на два несовместимых
# требования.
#
# Заголовки адреса клиента — как в ketocare-app.conf: X-Forwarded-For
# ПЕРЕЗАПИСЫВАЕТСЯ, а не дописывается (см. infra/nginx/README.md).
#
# HTTPS обязателен: Telegram открывает Mini App только по https, и подпись
# запуска по http не выдаётся вовсе. Сертификат добавляет certbot --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name tma.ketocare.railtech.uz;

    root /var/www/ketocare-miniapp;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Вставка в рамку разрешена только клиентам Telegram. Полного запрета здесь
    # быть не может — приложение открывается внутри Telegram Web; открытого
    # разрешения тоже: тогда любой сайт мог бы встроить кабинет ребёнка и
    # снимать нажатия поверх него (clickjacking).
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Приложение одноэкранное, но адрес приходит с хешем запуска
    # (#tgWebAppData=...) — отдаём index.html на любой путь.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
