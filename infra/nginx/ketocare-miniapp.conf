# Telegram Mini App (SPA из /var/www/ketocare-miniapp) + прокси /api.
#
# Отдельный host, а не путь внутри кабинета, — так требует раздел 13 ТЗ, и
# причина в заголовках: кабинет запрещает вставку в рамку (`X-Frame-Options`),
# а Mini App живёт ровно в ней — в веб-версии Telegram приложение открывается
# в iframe. Один host на двоих означал бы одну политику на два несовместимых
# требования.
#
# Заголовки адреса клиента — как в ketocare-app.conf: X-Forwarded-For
# ПЕРЕЗАПИСЫВАЕТСЯ, а не дописывается (см. infra/nginx/README.md).
#
# HTTPS обязателен: Telegram открывает Mini App только по https, и подпись
# запуска по http не выдаётся вовсе. Сертификат добавляет certbot --nginx.
#
# Политика подключается в КАЖДЫЙ location. Раньше она стояла на уровне server —
# и не доходила до index.html: `add_header` наследуется только туда, где нет
# своих `add_header`, а Cache-Control есть и в `/`, и в `/assets/`. То есть
# защита от clickjacking выглядела настроенной и не работала ровно на том
# ответе, ради которого написана (infra/nginx/security-headers.conf).

server {
    listen 80;
    listen [::]:80;
    server_name tma.ketocare.railtech.uz;

    root /var/www/ketocare-miniapp;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include snippets/ketocare-csp-miniapp.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        include snippets/ketocare-csp-miniapp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Приложение одноэкранное, но адрес приходит с хешем запуска
    # (#tgWebAppData=...) — отдаём index.html на любой путь.
    location / {
        include snippets/ketocare-csp-miniapp.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
