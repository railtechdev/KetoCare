# Веб-кабинет (SPA из /var/www/ketocare-app) + прокси /api в контейнер API.
# Файл кладётся в /etc/nginx/sites-available/ и включается симлинком в
# sites-enabled. HTTPS (443 + редирект с 80) добавляет certbot --nginx.
#
# Заголовки безопасности (раздел 11 ТЗ) подключаются в КАЖДЫЙ location:
# `add_header` с уровня server наследуется только в те блоки, где нет ни одной
# своей директивы `add_header`. Подробности и способ проверки — в
# infra/nginx/security-headers.conf.
#
# Заголовки адреса клиента — строго по infra/nginx/README.md: X-Forwarded-For
# ПЕРЕЗАПИСЫВАЕТСЯ ($remote_addr), а не дописывается
# ($proxy_add_x_forwarded_for) — иначе audit_log.ip и ключ rate-limit на
# /auth/* берутся из значения, которое выбрал сам клиент. Парный параметр —
# TRUSTED_PROXY_IPS=172.30.100.1 в .env (шлюз docker-сети, см.
# infra/docker-compose.prod.yml).

server {
    listen 80;
    listen [::]:80;
    server_name app.ketocare.railtech.uz;

    root /var/www/ketocare-app;
    index index.html;

    # CSV-импорт продуктов и будущие вложения (ADR-0004).
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include snippets/ketocare-security-headers.conf;
        include snippets/ketocare-csp-app.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Имена файлов в assets/ содержат хэш содержимого — кэшировать навсегда.
    location /assets/ {
        include snippets/ketocare-security-headers.conf;
        include snippets/ketocare-csp-app.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: все маршруты (/login, /app/...) отдают index.html, роутер разберётся.
    # index.html не кэшируется, иначе после деплоя браузеры держат старые хэши
    # ассетов и получают 404 на /assets/.
    location / {
        include snippets/ketocare-security-headers.conf;
        include snippets/ketocare-csp-app.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
